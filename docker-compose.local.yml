
services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: congapp
      POSTGRES_DB: congapp
      POSTGRES_PASSWORD: congapp123
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
      
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      - PG_CONNECTION_STRING=postgres://congapp:congapp123@postgres:5432/congapp
    ports:
      - '4444:4444'
    depends_on:
      postgres:
        condition: service_healthy